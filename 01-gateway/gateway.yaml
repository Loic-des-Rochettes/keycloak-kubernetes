# Public entry point of the platform: one GatewayClass handled by Envoy Gateway,
# one Gateway with an HTTP listener (redirect only) and an HTTPS listener.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Settings of the Envoy proxies deployed for the "public" Gateway.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  # By default ext_authz runs before the OIDC (oauth2) and JWT filters. Moving it
  # after jwt_authn gives the external authorization service the access token
  # obtained by the OIDC filter, and the claims already validated by the JWT filter.
  filterOrder:
    - name: envoy.filters.http.ext_authz
      after: envoy.filters.http.jwt_authn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      envoyPDB:
        minAvailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.kube.localhost"
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.kube.localhost"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kube-localhost-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: public
---
# Plain HTTP only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Headers that only the gateway may set are removed from every incoming request,
# before any filter runs: a client cannot spoof an identity header.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  headers:
    earlyRequestHeaders:
      remove:
        - X-Remote-User
        - X-Remote-Name
        - X-Remote-Email
        - X-Remote-Groups
        - X-Remote-Employee-Id
        - X-Remote-Department
        - X-Client-Id
        # Envoy is the first proxy here: client values are not trusted.
        - X-Forwarded-For
        - X-Forwarded-Host
        - X-Forwarded-Port
        - Forwarded
