# Keycloak cluster managed by the Keycloak Operator.
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
spec:
  instances: 2

  # Database created by CloudNativePG: "-rw" Service of the cluster (always the
  # primary) and the credentials Secret generated by the operator.
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
    # Fixed-size pool. Instances x poolMaxSize must stay below max_connections.
    poolInitialSize: 20
    poolMinSize: 20
    poolMaxSize: 20

  # TLS terminates at the Gateway; Keycloak serves plain HTTP inside the cluster
  # and the NetworkPolicy below restricts who can reach it.
  http:
    httpEnabled: true

  # Public URL used in tokens (issuer) and redirects, and a separate URL for
  # the administration console.
  hostname:
    hostname: https://keycloak.kube.localhost
    admin: https://keycloak-admin.kube.localhost

  # Envoy sets X-Forwarded-For and X-Forwarded-Proto.
  proxy:
    headers: xforwarded

  # Exposure is handled by Gateway API HTTPRoutes (routes.yaml).
  ingress:
    enabled: false

  # NetworkPolicy generated by the operator: the HTTP port only accepts traffic
  # from the Envoy proxies and from the userinfo-authz service of the demo.
  # The clustering port stays restricted to the Keycloak pods.
  networkPolicy:
    enabled: true
    http:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: demo
        podSelector:
          matchLabels:
            app.kubernetes.io/name: userinfo-authz

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1536Mi

  # Rolling update when compatible (configuration change, patch release),
  # recreate otherwise.
  update:
    strategy: Auto

  additionalOptions:
    - name: metrics-enabled
      value: "true"

  # Without spec.scheduling, the operator spreads the pods across zones and
  # nodes. On a multi-node or multi-site cluster, state the rule explicitly:
  # scheduling:
  #   affinity:
  #     podAntiAffinity:
  #       requiredDuringSchedulingIgnoredDuringExecution:
  #         - labelSelector:
  #             matchLabels:
  #               app: keycloak
  #               app.kubernetes.io/instance: keycloak
  #           topologyKey: kubernetes.io/hostname
