# Workloads of the demo: ordinary Deployments and Services, with no
# authentication code or configuration. The security lives in the routes
# (intranet-route.yaml, echo-api-route.yaml).
# userinfo-authz: external authorization service (ext_authz). No route
# points to it: only the Envoy proxies call it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userinfo-authz
  labels:
    app.kubernetes.io/name: userinfo-authz
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: userinfo-authz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: userinfo-authz
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.14.8-alpine3.24
          command: ["python", "-u", "/app/userinfo_authz.py"]
          env:
            # Internal URL: the call does not leave the cluster.
            - name: USERINFO_URL
              value: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/demo/protocol/openid-connect/userinfo
            - name: CACHE_TTL_SECONDS
              value: "10"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: demo-apps
---
apiVersion: v1
kind: Service
metadata:
  name: userinfo-authz
spec:
  selector:
    app.kubernetes.io/name: userinfo-authz
  ports:
    - name: http
      port: 8080
      targetPort: http
---
