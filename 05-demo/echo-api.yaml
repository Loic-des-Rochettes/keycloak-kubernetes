# REST API protected by bearer tokens: no redirect, 401 without a valid token,
# 403 without the role required by the HTTP method.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-api
  labels:
    app.kubernetes.io/name: echo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: python:3.14.8-alpine3.24
          command: ["python", "-u", "/app/echo_api.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: demo-apps
---
apiVersion: v1
kind: Service
metadata:
  name: echo-api
spec:
  selector:
    app.kubernetes.io/name: echo-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-api
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - api.kube.localhost
  rules:
    - backendRefs:
        - name: echo-api
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: echo-api
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: echo-api
  jwt:
    providers:
      - name: keycloak
        issuer: https://keycloak.kube.localhost/realms/demo
        # Keycloak adds "echo-api" to the audience of tokens that carry one
        # of its client roles.
        audiences:
          - echo-api
        remoteJWKS:
          uri: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/demo/protocol/openid-connect/certs
        claimToHeaders:
          - header: X-Client-Id
            claim: azp
          - header: X-Remote-User
            claim: preferred_username
  authorization:
    defaultAction: Deny
    rules:
      - name: read
        action: Allow
        operation:
          methods: ["GET", "HEAD"]
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: resource_access.echo-api.roles
                valueType: StringArray
                values: ["read"]
      - name: write
        action: Allow
        operation:
          methods: ["POST", "PUT", "PATCH", "DELETE"]
        principal:
          jwt:
            provider: keycloak
            claims:
              - name: resource_access.echo-api.roles
                valueType: StringArray
                values: ["write"]
